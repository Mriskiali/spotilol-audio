name: Build Debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Accept licenses + install SDK/NDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          # platform/build-tools/NDK best-effort: AGP auto-downloads what it needs once
          # licenses are accepted, so a missing package here must not fail the job.
          for pkg in "platforms;android-37" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"; do
            sdkmanager --install "$pkg" >/dev/null 2>&1 || echo "skip $pkg"
          done
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
      - name: Stub google-services.json
        # Dummy config only. Firebase collection is disabled in AndroidManifest and all
        # Firebase calls are try-guarded. Key shape kept valid (AIza + 33 chars).
        run: |
          python3 -c "import json; d={'project_info': {'project_number': '123456789012', 'project_id': 'spotilol-local-build', 'storage_bucket': 'spotilol-local-build.appspot.com'}, 'client': [{'client_info': {'mobilesdk_app_id': '1:123456789012:android:0123456789abcdef01234567', 'android_client_info': {'package_name': 'com.project.lol'}}, 'oauth_client': [], 'api_key': [{'current_key': 'AIzaSyDUMMYDUMMYDUMMYDUMMYDUMMYDUMMYDUM'}], 'services': {'appinvite_service': {'other_platform_oauth_client': []}}}], 'configuration_version': '1'}; json.dump(d, open('app/google-services.json', 'w'), indent=2); print('google-services.json OK')"
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Spotilol-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
